[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imotion-detector"
version = "1.0.0"
description = "Real-time facial emotion detection with pluggable engines: DeepFace, FER and OpenCV DNN."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Tamim Hasan" }]
keywords = [
    "emotion-detection",
    "facial-expression-recognition",
    "deepface",
    "fer",
    "opencv",
    "computer-vision",
    "webcam",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "opencv-python>=4.5",
    "numpy>=1.21",
]

[project.optional-dependencies]
deepface = ["deepface>=0.0.79"]
fer = ["fer>=21.0.1"]
all = ["deepface>=0.0.79", "fer>=21.0.1"]

[project.scripts]
imotion-detector = "imotion_detector.cli:main"

[tool.setuptools.packages.find]
include = ["imotion_detector*"]
