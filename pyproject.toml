[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imotion-detector"
version = "1.0.0"
description = "Real-time facial emotion detection with pluggable engines: DeepFace, FER and OpenCV DNN."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tamim Hasan" }]
keywords = [
    "emotion-detection",
    "facial-expression-recognition",
    "deepface",
    "fer",
    "opencv",
    "computer-vision",
    "webcam",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "opencv-python>=4.5.4,<5",
    "numpy>=1.21,<2.5",
]

[project.optional-dependencies]
deepface = ["deepface>=0.0.79"]
fer = ["fer>=21.0.1"]
all = ["deepface>=0.0.79", "fer>=21.0.1"]

[project.scripts]
imotion-detector = "imotion_detector.cli:main"

[project.urls]
Homepage = "https://github.com/tamimlabs/Imotion-detector"
Repository = "https://github.com/tamimlabs/Imotion-detector"
Issues = "https://github.com/tamimlabs/Imotion-detector/issues"

[tool.setuptools.packages.find]
include = ["imotion_detector*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", ".git", "models", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["imotion_detector", "tests", "main.py"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that need internet access (auto-skipped when offline)",
    "models: tests that download ONNX models (auto-skipped when offline)",
]
